services:
  - type: web
    name: swastya-assist
    runtime: docker
    healthCheckPath: /healthz
    envVars:
      - key: COOKIE_SECURE
        value: "1"
      - key: MAX_UPLOAD_MB
        value: "4"
      - key: HEALTH_INPUT_GATE
        value: "1"
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_TRANSCRIBE_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_VOICE_MODEL
        value: gemini-3.5-flash-lite
