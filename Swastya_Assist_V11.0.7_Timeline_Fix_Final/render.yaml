services:
  - type: web
    name: swastya-assist
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --bind 0.0.0.0:$PORT --access-logfile - --error-logfile - app:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.0
      - key: COOKIE_SECURE
        value: "1"
      - key: MAX_UPLOAD_MB
        value: "4"
      - key: HEALTH_INPUT_GATE
        value: "1"
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_TRANSCRIBE_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_VOICE_MODEL
        value: gemini-3.5-flash-lite
